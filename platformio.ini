[platformio]
default_envs = m5stack-cores3

[env:m5stack-cores3]
platform = espressif32
board = m5stack-cores3
framework = arduino

monitor_speed = 115200
upload_speed = 460800

build_flags =
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    m5stack/M5Unified @ 0.3.0

[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<RobotStateMachine.cpp> +<TranscriptionProtocol.cpp> +<RobotAudio.cpp>
build_flags = -I test/support
test_filter = test_controller, test_transcription, test_audio
